# Controlli automatici: a ogni push e a ogni pull request GitHub esegue ruff e i test.
name: Controlli

on:
  push:
  pull_request:

jobs:
  controlli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa ruff, pytest e le librerie usate dai test
        run: pip install ruff pytest requests python-dotenv
      - name: Ruff (stile ed errori banali)
        run: ruff check .
      - name: Test
        run: python -m pytest -q
